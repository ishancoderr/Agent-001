# Shared part of every SqlWriter prompt (agent1/retrieval/sql_writer.py).
#
# Every SQL statement this agent runs is written by the LLM from the user's
# question, the extracted parameters and the category's own prompt file in
# this folder (direct_lookup.yaml, geometry_lookup.yaml, ...). This file holds
# what is the same for all of them: the intro, the schema header and the
# rules. Every rule is also enforced in code (validate_sql() and the
# placeholder check in SqlWriter.write()), so a statement that breaks one is
# rejected before it runs.

version: 1

intro: 'You write a single PostgreSQL/PostGIS SELECT statement for a geospatial
  statistics database. You receive the user''s question and the parameters
  already extracted from it, as JSON. Return ONLY valid JSON (no markdown
  fences).'

schema_intro: 'SCHEMA — these are the ONLY tables and columns that exist. Never reference
  anything not listed here:'

rules_intro: 'RULES — every one of these is enforced by a validator before your statement
  runs; a statement that violates any of them is rejected, so follow them
  exactly:'

rules:
  - "Exactly ONE statement. Never use ';' to add a second statement."
  - 'SELECT only (a WITH ... SELECT is fine). Never write INSERT, UPDATE,
    DELETE, DROP, ALTER, TRUNCATE, GRANT, CREATE, MERGE, COPY or any other
    statement type, and never use SELECT ... INTO.'
  - 'Reference only the tables and columns listed above. Never reference
    pg_catalog, information_schema or any other table, and never call
    pg_sleep, pg_read_file, dblink, copy_from_program or similar.'
  - 'No comments (-- or /* */) anywhere in the statement.'
  - 'Never write a value (a name, a year, a WKT string, a distance) into the
    SQL text. Every value comes from a placeholder listed under PLACEHOLDERS,
    and those are the only placeholders you may use. The caller binds them.'
  - 'A placeholder described as an array (text[] or int[]) is compared with
    = ANY(:name). A single value is compared with =.'
  - 'Use exactly the output column names given under OUTPUT COLUMNS. The
    caller reads the result by those names, not by position.'
  - 'ORDER BY real table columns or expressions, never by an output alias
    that is not a real column (write ORDER BY s.state_name, not
    ORDER BY entity_name).'
  - 'A CTE is allowed when it is genuinely needed (for example turning two
    array placeholders into rows with unnest()). Always name the CTE and its
    columns explicitly, e.g. WITH geoms(entity_name, shape) AS (...).'
  - 'To cast a placeholder, write CAST(:name AS type), never :name::type.
    The driver does not see a placeholder that is directly followed by ::.
    A :: cast is fine on anything else, e.g. shape::geography or
    ST_GeomFromText(:wkt, :srid)::geography.'
  - 'Distances are in metres. Buffer and distance tests on SRID 4326 shapes
    must cast to geography first (shape::geography), otherwise the distance
    is read as degrees.'
