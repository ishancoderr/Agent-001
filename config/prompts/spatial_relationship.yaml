# Stage-2 extraction prompt: verdict-style spatial relationship queries
# (adjacency, direction, distance) — shared by SPATIAL_ADJACENCY,
# SPATIAL_DIRECTION and SPATIAL_DISTANCE.
#
# Prompt-specific content only — the valid attribute list and their aliases
# ("married" -> "marriages", etc.) are not repeated here; they live once in
# config/schema/attributes.yaml and are generated into the assembled prompt
# at build time. See config/prompts/direct_lookup.yaml for that convention.
#
# subject_rules below uses a literal block (|-) rather than a plain quoted
# string, because it contains a hand-aligned table of query -> subject/refs
# examples. Folding it (as the other prose fields are) would collapse that
# alignment into a run-on paragraph and make it harder for the model to read.
#
# `sections` is the render order — see agent1/pipeline/prompt_loader.py for
# how each name there is turned into prompt text and assembled with the
# other prompt files' sections into the final system prompt sent to the model.
# attribute_rules is folded into the "attributes" section rather than listed
# as its own section, since in the original prompt it was the third bullet
# of the same "Valid attributes" list as the generated alias rules.

version: 1

query_type: [SPATIAL_ADJACENCY, SPATIAL_DIRECTION, SPATIAL_DISTANCE]

sections: [intro, gazetteer, attributes, temporal_rules, output_schema, output_notes, subject_rules, examples]

gazetteer: [state, city]
attributes_entity: state

intro: 'You are extracting the details of a verdict-style spatial relationship query (adjacency,
  direction, or distance between German federal states) for a geospatial statistics
  database. Return ONLY valid JSON (no markdown fences).'

attribute_rules: 'Only include an attribute the query EXPLICITLY names. A pure spatial question
  ("Which states are within 100 km of Dortmund?", "Which states touch Hessen?") asks
  for the state list itself, not data — output "attributes": [] for it. Never invent
  population or a year the user did not mention.'

temporal_rules: '"temporal" is always a JSON array of every individual year being asked about, listed
  out in full — NOT a start/end pair. A range like "2015-2024" must be expanded into every
  year in that range. A single year is still a one-element array: [2021]. If the query says
  "now", "current", "currently", "this year", "today", or similar, use CURRENT_YEAR (given
  below). If no year is named or implied, leave this field an empty array: [] — this is
  harmless when "attributes" is also empty, since no data lookup happens in that case, but
  must never be filled in with a year the query gave no basis for.'

output_schema: |-
  {
    "spatial": "all",
    "temporal": [2021],
    "attributes": [],
    "spatial_relationship": {
      "type": "adjacency" | "north_of" | "south_of" | "east_of" | "west_of" | "distance",
      "subject": "Sachsen" or null,
      "refs": ["Hessen", "Hamburg"],
      "distance_km": 100
    }
  }

output_notes: '"spatial" is always "all" — the actual state list gets resolved from the relationship, not
  this field. "refs" holds the state/city name(s) the relationship is measured against.
  "distance_km" is only set when the relationship type is "distance".'

subject_rules: |-
  "subject" is the one thing the question asks ABOUT, and it decides what kind of answer is
  wanted:
    - A yes/no question names one thing and asks whether it stands in the relationship to
      another. Put that thing in "subject", and what it is measured against in "refs":
        "Does Sachsen lie north of Bayern?"      subject "Sachsen", refs ["Bayern"]
        "Do Bayern and Sachsen share a border?"  subject "Bayern",  refs ["Sachsen"]
        "Is Sachsen within 100 km of Dortmund?"  subject "Sachsen", refs ["Dortmund"]
    - A question asking WHICH states qualify wants the list, not a yes/no. Set "subject"
      to null and put every named reference in "refs":
        "Which states are north of Bayern?"            subject null, refs ["Bayern"]
        "Which state borders both Hessen and Hamburg?" subject null, refs ["Hessen","Hamburg"]
  Two names in "refs" with a null subject asks which states relate to ALL of them, which is
  a different question from a yes/no about a pair.

examples:
  - query: "Which state borders both Hessen and Hamburg? Show population 2015-2024"
    output: {spatial: "all", temporal: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024], attributes: ["population"], spatial_relationship: {type: "adjacency", subject: null, refs: ["Hessen", "Hamburg"], distance_km: null}}

  - query: "Do Bayern and Sachsen share a border?"
    output: {spatial: "all", temporal: [2021], attributes: [], spatial_relationship: {type: "adjacency", subject: "Bayern", refs: ["Sachsen"], distance_km: null}}

  - query: "Which states are north of Bayern?"
    output: {spatial: "all", temporal: [2021], attributes: [], spatial_relationship: {type: "north_of", subject: null, refs: ["Bayern"], distance_km: null}}

  - query: "Does Sachsen lie north of Bayern?"
    output: {spatial: "all", temporal: [2021], attributes: [], spatial_relationship: {type: "north_of", subject: "Sachsen", refs: ["Bayern"], distance_km: null}}

  - query: "States north of Bayern, population and marriages 2020-2021"
    output: {spatial: "all", temporal: [2020, 2021], attributes: ["population", "marriages"], spatial_relationship: {type: "north_of", subject: null, refs: ["Bayern"], distance_km: null}}

  - query: "Which states are within 100 km of Dortmund?"
    output: {spatial: "all", temporal: [2021], attributes: [], spatial_relationship: {type: "distance", subject: null, refs: ["Dortmund"], distance_km: 100}}

  - query: "Is Sachsen within 100 km of Dortmund?"
    output: {spatial: "all", temporal: [2021], attributes: [], spatial_relationship: {type: "distance", subject: "Sachsen", refs: ["Dortmund"], distance_km: 100}}
