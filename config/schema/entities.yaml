# Entity types — the named spatial things this system knows about.
#
# This is the set G of the specification (Section 2.2): "the named spatial
# entities the system knows". G was always multi-type — states together with
# cities — so adding a third type extends its membership without disturbing
# the gap mathematics.
#
# `enumerable` carries the specification's Section 2.3 checks:
#   true   a closed, listed set. A name outside it is a malformed query and no
#          message is sent to the peer.
#   false  open-ended. An unfamiliar name cannot be ruled out locally, so the
#          request goes to the peer and the peer decides.
#
# `gazetteer_block` is the paragraph the stage-2 extraction prompts (see
# config/prompts/*.yaml, which reference an entity type via its `gazetteer:`
# list) show the model for this entity type. For an enumerable type, the
# actual comma-joined name list is appended by agent1/pipeline/gazetteer.py's
# get_names_block() — not stored here, since it comes from name_aliases.yaml
# and would go stale if copied into this file too. For a non-enumerable type
# the block is used exactly as written, with nothing appended.
#
# `zone_search: true` marks a type whose members can be found INSIDE a zone —
# "which cities lie within 30 km of X", "which cities lie inside the merged
# area of X and Y" (Scenario 20 and the merge-then-search operation). Both
# agents test their own table for it, and the type travels in the KQML zone
# request. How a member is tested follows its `geometry_kind`: a point must
# lie within the zone, a line or polygon must intersect it.

version: 1

entities:

  state:
    enabled:         true
    label:           "federal state"
    label_plural:    "federal states"
    table:           states
    key_column:      state_name
    id_column:       state_id
    geometry_column: geo_shape
    geometry_kind:   polygon          # point | linestring | polygon
    srid:            4326             # coordinate system of geometry_column
    enumerable:      true
    gazetteer_block: >-
      German states (any reasonable spelling/capitalization is fine — names
      are normalized against the database automatically):

  city:
    enabled:         true
    label:           "city"
    label_plural:    "cities"
    table:           cities
    key_column:      city_name
    id_column:       city_id
    geometry_column: centroid
    geometry_kind:   point
    srid:            4326
    enumerable:      false
    zone_search:     true
    # Cities also carry plain numeric coordinates, which the distance resolver
    # reads directly instead of going through PostGIS.
    lat_column:      lat
    lng_column:      lng
    gazetteer_block: >-
      City names: any reasonable spelling, capitalization, or
      umlaut-vs-plain-vowel form is fine (e.g. München/Muenchen/Munich all
      resolve the same way) — names are normalized against the database
      automatically after extraction.

# A name can belong to two entity types at once — Berlin, Hamburg and Bremen
# are each both a city and a federal state. When a query names one without
# saying which it means, resolve it to this type.
ambiguous_name_default: state

# A name that is in no closed list (it is not one of the sixteen states) is
# read as this type when the query does not say: the open-ended type is the
# only one an unlisted name can still belong to. Used for the named places of
# operations and distance questions ("within 100 km of Dortmund").
unlisted_name_default: city

# ── Adding an entity type ────────────────────────────────────────────────────
# Copy a block, point it at your table, restart. No Python changes.
#
#   river:
#     enabled:         true
#     label:           "river"
#     label_plural:    "rivers"
#     table:           rivers
#     key_column:      river_name
#     id_column:       river_id
#     geometry_column: course
#     geometry_kind:   linestring
#     srid:            4326
#     enumerable:      false
#     zone_search:     true     # "which rivers cross the merged area of X and Y"
#
# What a linestring implies: relationships needing only a geometry — touches,
# north of, within distance — work unchanged. The four constructive operations
# still run, but the argument that produced exactly four of them (Section 3.3)
# is an argument about areas; intersecting two rivers yields points, not an
# area. The response reports the result's real geometry_type either way, so
# the answer stays honest about what it actually is.
