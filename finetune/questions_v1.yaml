# Fine-tuning questions, version 1 — 120 questions.
#
#   group          classify label(s)                                  count
#   data           DIRECT_LOOKUP (2 of them end as NEEDS_YEAR)           22
#   geometry       GEOMETRY_LOOKUP                                       22
#   operation      SPATIAL_OPERATION (incl. BufferWithin)                22
#   relationship   SPATIAL_ADJACENCY / _DIRECTION / _DISTANCE            22
#   delegation     SPATIAL_RELATIONSHIP_BUFFER                           22
#   unrelated      UNRELATED                                             10
#
# Each entry holds only what a person decides: the question, its category and
# the correct extraction. build_examples.py derives the cleaned text, every
# SQL step the pipeline would run, and the gold SQL (finetune/reference_sql.py).
#
# The twenty questions of Data_Missingness_Scenarios_V18 are deliberately NOT
# here — they belong to the test set.
#
# Optional fields
#   presence: [...]        the fetch is assumed to return no rows for these
#                          places, so the presence step runs for them
#   peer: true             also write the SQL Agent-1/Agent-2 runs when the
#                          OTHER agent asks for this (both wordings)
#   expect: NEEDS_YEAR     the parser must turn this extraction into NEEDS_YEAR
#   names_translated: true the label uses a name the question spells differently
#                          (Bavaria -> Bayern); skips the "name is in the text" check
#
# Extraction labels use names exactly as they appear AFTER CleanQuery, which
# rewrites German spellings (München -> Munich, Thueringen -> Thüringen) but
# not English ones (Bavaria stays Bavaria, so the label has to translate it).

