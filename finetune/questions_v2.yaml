# Fine-tuning questions, version 2 — 332 questions (v1's 120 + 212 new).
#
# Written by hand: drafted with Claude Code in October 2026 following the plan
# in HOW_TO_WRITE_QUESTIONS.md, to be reviewed by the thesis author. That guide
# explains every field, the format per category and how to add questions.
#
# What changed from v1
#   - every v1 question is kept unchanged, in the same place; the new questions
#     are appended at the END of each group, so v1's validation questions
#     (d10, d20, g10, ...) are still validation questions here and v1 and v2
#     adapters can be compared on the same questions
#   - aimed at v1's weak spots: buffer tests 4 -> 14, presence checks 4 -> 13,
#     questions without a year 2 -> 5, more English names, more relationship
#     questions that also ask for data
#   - years mostly 1990-2019 (what Agent-001's database holds); city names
#     taken from the agents' cities table
#   - NEW KIND OF QUESTION: merge (or overlap / remove) states, then which cities
#     lie inside the new shape — SPATIAL_OPERATION with "target_entity": city
#     (o51-o65). The agent builds the shape, then searches it for cities on both
#     agents with the Scenario 20 zone test.
#   - edge cases at the end of every group: empty answers, one-year ranges,
#     ranges written backwards, all capitals, very small and very large
#     distances, references only the other agent holds, Hamburg the state vs
#     Hamburg the city, greetings
#
#   group          classify label(s)                                  v1   new   v2
#   data           DIRECT_LOOKUP (7 NEEDS_YEAR, 6 combined totals)    22  +44    66
#   geometry       GEOMETRY_LOOKUP                                    22  +29    51
#   operation      SPATIAL_OPERATION (14 BufferWithin, 15 + cities,   22  +48    70
#                  4 merge + the merged area's data)
#   relationship   SPATIAL_ADJACENCY / _DIRECTION / _DISTANCE         22  +36    58
#   delegation     SPATIAL_RELATIONSHIP_BUFFER (8 in a state,         22  +40    62
#                  8 in a direction)
#   unrelated      UNRELATED                                          10  +15    25
#
# The questions of test_set_v1.yaml and the twenty scenario questions of
# Data_Missingness_Scenarios_V18 are deliberately NOT here — they are the test set.
#
# Optional fields
#   presence: [...]        the fetch is assumed to return no rows for these
#                          places, so the presence step runs for them
#   peer: true             also write the SQL Agent-1/Agent-2 runs when the
#                          OTHER agent asks for this (both wordings)
#   expect: NEEDS_YEAR     the parser must turn this extraction into NEEDS_YEAR
#   names_translated: true the label uses a name the question spells differently
#                          (Bavaria -> Bayern); skips the "name is in the text" check
#
# Extraction labels use names exactly as they appear AFTER CleanQuery, which
# rewrites German spellings (München -> Munich, Thueringen -> Thüringen) but
# not English ones (Bavaria stays Bavaria, so the label has to translate it).

