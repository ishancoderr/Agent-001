# Test set, version 1 — 109 questions for comparing the six models.
#
#   NEVER TRAIN ON THIS FILE. It is not read by build_examples.py by default,
#   no question here appears in questions_v1.yaml or questions_v2.yaml, and it
#   must stay that way — otherwise the test measures memory, not ability.
#
# Used to compare all six models (GPT-4o mini, GPT-4, Claude Haiku, Claude
# Opus, Qwen3-8B, Qwen3-8B + QLoRA) on the same questions. Every entry has the
# same format as the training files, so the expected category and the expected
# extraction can be checked automatically; the final data or shapes an agent
# returns depend on the databases and are confirmed by hand, as the Evaluation
# Method describes. The twenty scenario questions (Data_Missingness_Scenarios_V18)
# are a separate test and are not repeated here.
#
#   category                       count   ids
#   DIRECT_LOOKUP                     13   td01–td13  (td12, td13 must end as NEEDS_YEAR)
#   GEOMETRY_LOOKUP                   13   tg01–tg13
#   SPATIAL_OPERATION                 18   to01–to18  (to11–to13 BufferWithin; to14–to18
#                                                  merge states, then the cities inside)
#   SPATIAL_RELATIONSHIP_BUFFER       17   tb01–tb17  (tb14–tb17 cities inside one state)
#   SPATIAL_ADJACENCY                 12   ta01–ta12
#   SPATIAL_DIRECTION                 12   tr01–tr12
#   SPATIAL_DISTANCE                  12   ts01–ts12
#   UNRELATED                         12   tu01–tu12
#                                    ---
#                                    109
#
# Written with Claude Code in October 2026; to be reviewed by the thesis author.
# Years are mostly 1990–2019 (what the agents' databases hold); a few later years
# test the not-found outcome. City names come from the agents' cities table.
# Labels follow the same rules as the training files (HOW_TO_WRITE_QUESTIONS.md).

# ══ DIRECT_LOOKUP ════════════════════════════════════════════════════════════

- {id: td01, category: DIRECT_LOOKUP, question: "What was the population of Sachsen-Anhalt in 2005?",
   extract: {spatial: [Sachsen-Anhalt], temporal: [2005], attributes: [population], entity_type: state}}
- {id: td02, category: DIRECT_LOOKUP, question: "Show live births in Mecklenburg-Vorpommern and Brandenburg for 2010",
   extract: {spatial: [Mecklenburg-Vorpommern, Brandenburg], temporal: [2010], attributes: [live_births], entity_type: state}}
