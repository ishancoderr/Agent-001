# Test set v2 — the answer key for the 100 unseen questions of test_set_v2.txt.
#
# THIS IS THE RESEARCH TEST SET. Never train on it, never put these questions
# (or close rewordings) into questions_vN.yaml, and never change the agents or
# the prompts because of results measured on it — fix with validation data.
#
# Used only by the evaluator (evaluator/, the workbench's Evaluation tab), which
# compares each model's classify label and extraction with the labels below.
# The expected FINAL answers are not written here: the first answer confirmed
# correct by hand in the Evaluation tab becomes the reference for the others.
#
# Same format as questions_vN.yaml (see HOW_TO_WRITE_QUESTIONS.md), so
#   python -m finetune.build_examples <a scratch copy of this file>
#   python -m finetune.check_dataset  <its .jsonl>
# can prove every label is valid. Ids t001-t100 are the numbers in the .txt.
#
# Drafted with Claude Code in October 2026 — to be reviewed by the thesis author.

